    *{box-sizing:border-box}

    .wrap{max-width:1024px;margin:20px auto;padding:0 16px}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:18px;
      box-shadow:0 6px 24px rgba(15,23,42,.05);
    }

    h1{margin:0 0 6px;font-size:1.45rem}
    .muted{color:var(--muted)}
    .hidden{display:none !important;}

    .status{
      border:1px solid var(--line);
      border-radius:10px;
      padding:12px;
      margin:12px 0;
      font-size:14px;
      line-height:1.45;
    }
    .status.loading{background:#eef4ff;border-color:#bfd3ff;color:#24427a;}
    .status.ok{background:#ecfdf3;border-color:#86efac;color:#166534;}
    .status.err{background:#fef2f2;border-color:#fca5a5;color:#991b1b;}
    .status.warn{background:#fffbeb;border-color:#fcd34d;color:#92400e;}

    .grid-info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 6px}
    @media (max-width:720px){.grid-info{grid-template-columns:1fr}}
    .info{
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px

    .info b{display:block;margin-bottom:4px;color:#111827}

    .legend{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
    .pill{

      background:var(--chip);
      font-size:.86rem

    .progress{

      border-radius:999px;
      overflow:hidden

      padding:12px;
      background:#fbfcfe;
      margin-bottom:12px

    .item.invalid{
      border-color:#ef4444 !important;
      background:#fef2f2;
    }

    .stem{font-size:1rem;margin-bottom:10px}
    .scale{display:grid;gap:8px}
    .ends{display:flex;justify-content:space-between;align-items:flex-end}
    .ends span{font-size:.9rem;color:var(--muted)}

    .rail{
  position:relative;
  padding:10px 0 0;
}

input[type="range"]{
  width:100%;
  display:block;
  appearance:none;
  -webkit-appearance:none;
  background:transparent;
  height:var(--thumb-size);
  margin:0;
  padding:0;
}



    input[type="range"]:focus{
      outline:none;
    }

    input[type="range"]::-webkit-slider-runnable-track{
      height:var(--track-height);
      border-radius:999px;
      background:linear-gradient(90deg, var(--track), var(--trackFill));
    }

    input[type="range"]::-moz-range-track{
      height:var(--track-height);
      border-radius:999px;
      background:linear-gradient(90deg, var(--track), var(--trackFill));
    }

    input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance:none;
      appearance:none;
      width:var(--thumb-size);
      height:var(--thumb-size);
      border-radius:999px;
      background:var(--thumb);
      border:3px solid var(--thumbBorder);
      margin-top:calc((var(--track-height) - var(--thumb-size)) / 2);
      cursor:pointer;
      box-shadow:0 1px 4px rgba(0,0,0,.15);
    }

    input[type="range"]::-moz-range-thumb{
      width:var(--thumb-size);
      height:var(--thumb-size);
      border-radius:999px;
      background:var(--thumb);
      border:3px solid var(--thumbBorder);
      cursor:pointer;
      box-shadow:0 1px 4px rgba(0,0,0,.15);
    }

    .ticks{
  position:relative;
  width:calc(100% - var(--thumb-size));
  margin-left:calc(var(--thumb-size) / 2);
  height:20px;
  margin-top:8px;
}

.tick{
  position:absolute;
  top:0;
  transform:translateX(-50%);
  font-size:.85rem;
  color:var(--muted);
  line-height:1;
  white-space:nowrap;
}

.tick:first-child{
  left:0% !important;
  transform:translateX(0);
}

.tick:last-child{
  left:100% !important;
  transform:translateX(-100%);
}
    .valpill{

    function isObject(v) {
      return v && typeof v === "object" && !Array.isArray(v);
    }

    function containsTestCode(jsonb, testCode) {
      if (!jsonb) return false;

      if (typeof jsonb === "string") return jsonb === testCode;

      if (Array.isArray(jsonb)) {
        return jsonb.some(item => {
          if (typeof item === "string") return item === testCode;
          if (isObject(item)) {
            return item.code === testCode || item.test_code === testCode || item.id === testCode || containsTestCode(item, testCode);
          }
          return false;
        });
      }

      if (isObject(jsonb)) {
        if (Object.prototype.hasOwnProperty.call(jsonb, testCode)) {
          const value = jsonb[testCode];
          if (value !== false && value !== null && value !== undefined) return true;
          return false;
        }

        if (jsonb.code === testCode || jsonb.test_code === testCode || jsonb.id === testCode) return true;

        return Object.values(jsonb).some(v => containsTestCode(v, testCode));
      }

      return false;
    }

    function normalizeTestsFeitosForSave(current) {
      const out = {};

      if (!current) return out;

      if (typeof current === "string") {
        out[current] = { feito: true };
        return out;
      }

      if (Array.isArray(current)) {
        current.forEach(item => {
          if (typeof item === "string") {
            out[item] = { feito: true };
          } else if (isObject(item)) {
            const code = item.code || item.test_code || item.id;
            if (code) {
              out[code] = {
                ...item,
                feito: ("feito" in item) ? Boolean(item.feito) : true
              };
            }
          }
        });
        return out;
      }

      if (isObject(current)) {
        Object.entries(current).forEach(([key, value]) => {
          if (typeof value === "boolean") {
            out[key] = { feito: value };
          } else if (typeof value === "string") {
            out[key] = { feito: !["false", "0", "nao", "não"].includes(value.toLowerCase()) };
          } else if (isObject(value)) {
            out[key] = { ...value };
          } else {
            out[key] = { feito: Boolean(value) };
          }
        });
      }

      return out;
    }

    function buildUpdatedTestsFeitos(currentTestsFeitos, testCode, submittedAtIso) {
      const next = normalizeTestsFeitosForSave(currentTestsFeitos);

      next[testCode] = {
        ...(isObject(next[testCode]) ? next[testCode] : {}),
        feito: true,
        submitted_at: submittedAtIso
      };

      return next;
    }

    function redirectToAreaPaciente() {
      const token = getTokenFromUrl();
      window.location.href = token ? `${AREA_PACIENTE_URL}?token=${encodeURIComponent(token)}` : AREA_PACIENTE_URL;
    }

    function getFieldNameByQuestionNumber(num) {
      return `q${String(num).padStart(2, "0")}`;
    }

    function renderPatientInfo(patient) {
      const g = $("#pacInfo");
      g.innerHTML = "";

      const info = [
        ["Nome", patient.nome || "-"],
        ["E-mail", patient.email || "-"]
      ];

      info.forEach(([k, v]) => {
        const div = document.createElement("div");
        div.className = "info";
        div.innerHTML = `<b>${k}</b><div>${v || "-"}</div>`;
        g.appendChild(div);
      });

      g.classList.remove("hidden");
    }

    function renderQuestions() {
      const host = $("#qs");
      host.innerHTML = "";

      ITEMS.forEach((text, idx) => {
        const q = idx + 1;
        const qn = String(q).padStart(2, "0");

        const wrap = document.createElement("div");
        wrap.className = "item";
        wrap.setAttribute("data-q", String(q));
        wrap.setAttribute("data-field", `q${qn}`);

        const stem = document.createElement("div");
        stem.className = "stem";
        stem.id = `s${qn}`;
        stem.textContent = text;

        const scale = document.createElement("div");
        scale.className = "scale";

        const ends = document.createElement("div");
        ends.className = "ends";
        ends.innerHTML = `<span>Descreve-me muito mal</span><span>Descreve-me muito bem</span>`;

        const rail = document.createElement("div");
        rail.className = "rail";
        rail.innerHTML = `
          <input type="range" min="1" max="7" step="1" id="r${qn}" aria-labelledby="s${qn}">
         <div class="ticks">
  <div class="tick" style="left:0%">1</div>
  <div class="tick" style="left:16.6667%">2</div>
  <div class="tick" style="left:33.3333%">3</div>
  <div class="tick" style="left:50%">4</div>
  <div class="tick" style="left:66.6667%">5</div>
  <div class="tick" style="left:83.3333%">6</div>
  <div class="tick" style="left:100%">7</div>
</div>
        `;

        const controls = document.createElement("div");
        controls.className = "controls";
        controls.innerHTML = `
          <span class="muted">Valor escolhido:</span>
          <span id="v${qn}" class="valpill">—</span>
          <button class="btn ghost" type="button" id="b${qn}">Limpar</button>
          <input type="hidden" name="q${qn}" id="h${qn}" value="">
        `;

        scale.append(ends, rail, controls);
        wrap.append(stem, scale);
        host.appendChild(wrap);

        const range = rail.querySelector(`#r${qn}`);
        const hidden = controls.querySelector(`#h${qn}`);
        const valpill = controls.querySelector(`#v${qn}`);
        const btnClear = controls.querySelector(`#b${qn}`);

        range.addEventListener("input", () => {
          hidden.value = range.value;
          valpill.textContent = range.value;
          wrap.classList.remove("invalid");
          updateProgress();
          saveDraft();
        });

        btnClear.addEventListener("click", () => {
          hidden.value = "";
          range.value = "1";
          valpill.textContent = "—";
          updateProgress();
          saveDraft();
        });
      });
    }

    const STORAGE_KEY = `IFP2_${getCpfFromUrl() || "anon"}`;

    function saveDraft() {
      const data = {};
      for (let i = 1; i <= ITEMS.length; i++) {
        const qn = String(i).padStart(2, "0");
        const v = $(`#h${qn}`)?.value;
        if (v) data[`q${qn}`] = Number(v);
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        setStatus("Rascunho salvo neste dispositivo.", "ok");
      } catch (e) {
        console.warn("Falha ao salvar rascunho", e);
      }
    }

    function restoreDraft() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;

        const data = JSON.parse(raw);
        Object.entries(data || {}).forEach(([k, v]) => {
          const qn = k.replace("q", "");
          const hid = $(`#h${qn}`);
          const rng = $(`#r${qn}`);
          const pill = $(`#v${qn}`);
          if (hid && rng && pill) {
            hid.value = String(v);
            rng.value = String(v);
            pill.textContent = String(v);
          }
        });
      } catch (e) {
        console.warn("Falha ao restaurar rascunho", e);
      }
    }

    function clearDraft() {
      localStorage.removeItem(STORAGE_KEY);
      for (let i = 1; i <= ITEMS.length; i++) {
        const qn = String(i).padStart(2, "0");
        const hid = $(`#h${qn}`);
        const rng = $(`#r${qn}`);
        const pill = $(`#v${qn}`);
        const row = document.querySelector(`.item[data-q="${i}"]`);
        if (hid) hid.value = "";
        if (rng) rng.value = "1";
        if (pill) pill.textContent = "—";
        if (row) row.classList.remove("invalid");
      }
      updateProgress();
      setStatus("Rascunho apagado.", "warn");
    }

    function countAnswered() {
      let c = 0;
      for (let i = 1; i <= ITEMS.length; i++) {
        const qn = String(i).padStart(2, "0");
        if ($(`#h${qn}`)?.value) c++;
      }
      return c;
    }

    function updateProgress() {
      const a = countAnswered();
      const t = ITEMS.length;
      $("#progressText").textContent = `Progresso: ${a}/${t}`;
      $("#bar").style.width = `${(a / t) * 100}%`;
    }

    function formDataToObjectIFP() {
      const result = {};
      for (let i = 1; i <= ITEMS.length; i++) {
        const qn = String(i).padStart(2, "0");
        const field = `q${qn}`;
        const value = $(`#h${qn}`)?.value || "";
        if (value !== "") result[field] = Number(value);
      }
      return result;
    }

    function buildResultsPerguntasRespostasIFP(answersObj) {
      return [];
    }

    function sumByQuestionNumbers(answersObj, questionNumbers) {
      return (questionNumbers || []).reduce((acc, n) => {
        const key = getFieldNameByQuestionNumber(n);
        return acc + Number(answersObj[key] || 0);
      }, 0);
    }

function buildResultsMetaPayloadIFP(answersObj) {
  return Object.entries(INDICATORS_CONFIG).map(([key, cfg], index) => ({
    key: key,
    label: cfg.label,
    order: index + 1,
    value: sumByQuestionNumbers(answersObj, cfg.questions)
  }));
}

    function validateAllAnswered() {
      document.querySelectorAll(".item.invalid").forEach(el => el.classList.remove("invalid"));

      for (let i = 1; i <= ITEMS.length; i++) {
        const qn = String(i).padStart(2, "0");
        const hid = $(`#h${qn}`);
        if (!hid || !hid.value) {
          const row = document.querySelector(`.item[data-q="${i}"]`);
          if (row) {
            row.classList.add("invalid");
            row.scrollIntoView({ behavior: "smooth", block: "center" });
          }
          throw new Error(`Responda a questão ${i}.`);
        }
      }
    }

    async function getPatientFormAccessByToken() {
      const token = getTokenFromUrl();
      const testCode = getTestCodeFromUrl();

      if (!token || !testCode) {
        return { data: null, error: new Error("Link invalido ou formulario nao informado.") };
      }

      if (window.__patientFormAccess && window.__patientFormAccess.form_code === testCode) {
        return { data: window.__patientFormAccess, error: null };
      }

      if (!window.__patientFormAccessPromise) {
        window.__patientFormAccessPromise = supabaseClient
          .rpc("get_public_patient_form_access", {
            p_token: token,
            p_form_code: testCode
          })
          .then(({ data, error }) => {
            if (error) return { data: null, error };
            const row = Array.isArray(data) ? data[0] : data;
            window.__patientFormAccess = row || null;
            return { data: row || null, error: null };
          });
      }

      return window.__patientFormAccessPromise;
    }

    function installPatientTokenAccessShim() {
      if (!supabaseClient || supabaseClient.__patientTokenAccessShim) return;

      const originalFrom = supabaseClient.from.bind(supabaseClient);

      supabaseClient.from = function(table) {
        if (table !== "patients") return originalFrom(table);

        const selectBuilder = {
          select() { return this; },
          eq() { return this; },
          in() { return this; },
          limit() { return this; },
          order() { return this; },
          maybeSingle() { return getPatientFormAccessByToken(); },
          single() { return getPatientFormAccessByToken(); },
          async then(resolve, reject) {
            try {
              const result = await getPatientFormAccessByToken();
              return resolve(result);
            } catch (err) {
              if (reject) return reject(err);
              throw err;
            }
          }
        };

        return {
          select() { return selectBuilder; },
          update() {
            return {
              eq: async () => ({ data: null, error: null })
            };
          }
        };
      };

      supabaseClient.__patientTokenAccessShim = true;
    }


    async function validarAcessoAoTeste() {
      const cpf = getCpfFromUrl();
      const token = getTokenFromUrl();
      installPatientTokenAccessShim();
      const testCode = getTestCodeFromUrl();

      if (!token) {
        setStatus("Link invalido ou expirado. Abra o formulario pela area do paciente.", "err");
        return null;
      }

      if (!testCode) {
        setStatus("Código do teste não informado.", "err");
        return null;
      }

      $("#metaInfo").classList.remove("hidden");
      $("#metaInfo").innerHTML = `
        <span class="pill">Acesso por token</span>
        <span class="pill">Teste: ${testCode}</span>
      `;

      setStatus("Consultando liberação do teste...", "loading");

      const { data, error } = await supabaseClient
        .from("patients")
        .select("cpf, nome, email, tests_liberados, tests_feitos")
        .eq("cpf", cpf)
        .maybeSingle();

      if (error) {
        console.error(error);
        setStatus("Erro ao consultar a base de dados.", "err");
        return null;
      }

      if (!data) {
        setStatus("CPF não encontrado.", "err");
        return null;
      }

      const liberado = isTestLiberado(data.tests_liberados, testCode);
      if (!liberado) {
        setStatus("Teste não liberado.", "warn");
        return null;
      }

      const feito = isTestFeito(data.tests_feitos, testCode);
      if (feito) {
        setStatus("Teste já realizado. Redirecionando para a área do paciente...", "ok");
        setTimeout(() => redirectToAreaPaciente(cpf), 700);
        return null;
      }

      setStatus("Teste liberado. Formulário disponível.", "ok");
      return data;
    }

    async function boot() {
      renderQuestions();
      restoreDraft();
      updateProgress();

      const patient = await validarAcessoAoTeste();
      if (!patient) return;

      renderPatientInfo(patient);
      $("#formWrap").classList.remove("hidden");
      $("#progressWrap").classList.remove("hidden");
    }

    $("#btnSave")?.addEventListener("click", saveDraft);
    $("#clearDraft")?.addEventListener("click", clearDraft);

    $("#testForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btn = $("#submitBtn");
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Enviando...";

      try {
        const cpf = getCpfFromUrl();
        const token = getTokenFromUrl();
        installPatientTokenAccessShim();
        const testCode = getTestCodeFromUrl();
        const submittedAt = new Date().toISOString();

        validateAllAnswered();

        const rawPayload = formDataToObjectIFP();
        const resultsPayload = buildResultsPerguntasRespostasIFP(rawPayload);
        const resultsMetaPayload = buildResultsMetaPayloadIFP(rawPayload);

        const { data: patient, error: patientError } = await supabaseClient
          .from("patients")
          .select("cpf, tests_liberados, tests_feitos")
          .eq("cpf", cpf)
          .maybeSingle();

        if (patientError) {
          console.error(patientError);
          throw new Error("Erro ao consultar paciente.");
        }

        if (!patient) throw new Error("CPF não encontrado.");

        const liberado = isTestLiberado(patient.tests_liberados, testCode);
        if (!liberado) throw new Error("Teste não liberado.");

        const jaFeito = isTestFeito(patient.tests_feitos, testCode);
        if (jaFeito) {
          redirectToAreaPaciente(cpf);
          return;
        }

        const { error: insertError } = await supabaseClient
          .from("respostas")
          .insert([{
            cpf: cpf,
            code: testCode,
            submitted_at: submittedAt,
            results: resultsPayload,
            results_meta: resultsMetaPayload
          }]);

        if (insertError) {
          console.error("ERRO INSERT respostas:", insertError);
          throw new Error(
            `Erro ao salvar respostas: ${insertError.message || ""} ${insertError.details || ""} ${insertError.hint || ""}`.trim()
          );
        }

        const nextTestsFeitos = buildUpdatedTestsFeitos(patient.tests_feitos, testCode, submittedAt);

        const { error: updateError } = await supabaseClient
          .from("patients")
          .update({
            tests_feitos: nextTestsFeitos
          })
          .eq("cpf", cpf);

        if (updateError) {
          console.error(updateError);
          throw new Error("Resposta salva, mas falhou ao marcar teste como feito.");
        }

        clearDraft();
        setStatus("Respostas enviadas com sucesso. Redirecionando...", "ok");

        setTimeout(() => {
          redirectToAreaPaciente(cpf);
        }, 700);

      } catch (err) {
        console.error(err);
        setStatus(err?.message || "Erro ao enviar o formulário.", "err");
        alert(err?.message || "Erro ao enviar o formulário.");
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });

    boot();
  </script>
</body>
</html>
